name: Validate pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pull-request-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck monorepo
        run: pnpm typecheck

      - name: Lint monorepo
        run: pnpm lint

      - name: Test monorepo
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm --filter @glymize/web exec playwright install --with-deps chromium

      - name: Test web critical flows
        run: pnpm --filter @glymize/web test:e2e
