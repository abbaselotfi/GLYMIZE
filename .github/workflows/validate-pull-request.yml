name: Validate pull request

on:
  pull_request:
    branches:
      - main
      - developer

permissions:
  contents: read

concurrency:
  group: pull-request-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Enforce staged branch flow
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" != "developer" ]]; then
            echo "Pull requests to main must come from developer; got $HEAD_REF." >&2
            exit 1
          fi
          if [[ "$BASE_REF" == "developer" && "$HEAD_REF" != feat/* && "$HEAD_REF" != feature/* ]]; then
            echo "Pull requests to developer must come from feat/<task> or feature/<task>; got $HEAD_REF." >&2
            exit 1
          fi

      - name: Enforce Roadmap and Graph Gate declarations
        shell: bash
        run: |
          set -euo pipefail
          body="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          if ! grep -Fq -- '- [x] Roadmap review: PASS' <<<"$body"; then
            echo 'Missing required checked PR declaration: - [x] Roadmap review: PASS' >&2
            exit 1
          fi
          if ! grep -Fq -- '- [x] Graph gate: PASS' <<<"$body"; then
            echo 'Missing required checked PR declaration: - [x] Graph gate: PASS' >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck monorepo
        run: pnpm typecheck

      - name: Lint monorepo
        run: pnpm lint

      - name: Test monorepo
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm --filter @glymize/web exec playwright install --with-deps chromium

      - name: Test web critical flows
        run: pnpm --filter @glymize/web test:e2e
