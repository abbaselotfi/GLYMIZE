name: One-shot Type 2 precedence POST finalize

on:
  push:
    branches:
      - 'docs/type2-precedence-legacy-boundary-20260908'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CBM_VERSION: '0.10.8'
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: docs/type2-precedence-legacy-boundary-20260908

      - name: Truth-sync Phase 2 precedence status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/PROJECT_OVERVIEW_AND_ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          old = '- [ ] Define rule precedence'
          new = '- [x] Define rule precedence'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one open precedence checkbox, found {text.count(old)}')
          text = text.replace(old, new, 1)
          roadmap.write_text(text, encoding='utf-8')

          rebaseline = Path('docs/REMAINING_ROADMAP_REBASELINE_2026-09-08.md')
          rtext = rebaseline.read_text(encoding='utf-8')
          old_row = '| Define rule precedence | **Partial** | The live Type 2 Decision Graph has structural hard gates, objectives, policy ordering and composition boundaries. The repository does not yet have one concise, system-wide precedence specification covering every retained compatibility path and future module. |'
          new_row = '| Define rule precedence | **Implemented — live Type 2** | `docs/architecture/CLINICAL_RULE_PRECEDENCE.md` records the configured Decision Graph precedence and the explicit unconfigured/admin-preview/local-development legacy-score exceptions; `type2-live-authority-v2.test.ts` guards those boundaries. Broader non-Type-2 modules remain subject to their own authority reviews. |'
          if rtext.count(old_row) != 1:
              raise SystemExit(f'expected exactly one precedence status row, found {rtext.count(old_row)}')
          rtext = rtext.replace(old_row, new_row, 1)

          old_next = 'The safest remaining Phase 2 work is governance/consolidation, not new clinical thresholds: formalize precedence across supported execution paths, quantify the retained legacy-score compatibility boundary, and define clinician-approved golden-case governance. New clinical values still require exact reviewed evidence.'
          new_next = 'With live Type 2 precedence and the retained legacy-score boundary now formalized, the safest remaining Phase 2 work is governance/consolidation: keep the legacy score path bounded while addressing unexplained compatibility-score constants, broaden traceable rule/input/version metadata where evidence shows a real gap, and define clinician-approved golden-case governance. New clinical values still require exact reviewed evidence.'
          if rtext.count(old_next) != 1:
              raise SystemExit(f'expected exactly one Phase 2 next-work paragraph, found {rtext.count(old_next)}')
          rtext = rtext.replace(old_next, new_next, 1)
          rebaseline.write_text(rtext, encoding='utf-8')
          PY

      - name: Verify final diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- docs/PROJECT_OVERVIEW_AND_ROADMAP.md docs/REMAINING_ROADMAP_REBASELINE_2026-09-08.md

      - name: Commit final documentation state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_OVERVIEW_AND_ROADMAP.md docs/REMAINING_ROADMAP_REBASELINE_2026-09-08.md
          git commit -m 'docs: close live Type 2 rule precedence item'

      - name: Install pinned Codebase Memory
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh -o /tmp/install-cbm.sh
          chmod +x /tmp/install-cbm.sh
          CBM_DOWNLOAD_URL="https://github.com/DeusData/codebase-memory-mcp/releases/download/v${CBM_VERSION}" \
            /tmp/install-cbm.sh --skip-config --dir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Codebase Memory version
        shell: bash
        run: |
          set -euo pipefail
          codebase-memory-mcp --version | tee /tmp/cbm-version.txt
          grep -Fq "${CBM_VERSION}" /tmp/cbm-version.txt

      - name: Run normative POST graph gate
        shell: pwsh
        run: ./scripts/codebase-memory-gate.ps1 -Phase post -RoadmapReviewed -GraphRelevant

      - name: Remove one-shot workflow and push final branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/type2-precedence-post-finalize-oneshot.yml
          git commit -m 'ci: remove completed Type 2 precedence POST workflow'
          git push origin HEAD:docs/type2-precedence-legacy-boundary-20260908
