name: One-shot Type 2 lifecycle roadmap truth sync

on:
  push:
    branches:
      - 'chore/type2-source-review-lifecycle-20260908'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CBM_VERSION: '0.10.8'
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply qualified roadmap truth sync
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence, found {count}: {old!r}")
              p.write_text(s.replace(old, new, 1), encoding="utf-8")

          roadmap = "docs/PROJECT_OVERVIEW_AND_ROADMAP.md"
          replace_once(
              roadmap,
              "- [ ] Create traceable rule metadata\n",
              "- [x] Create traceable rule metadata — implemented for live Type 2 Decision Graph authority; no repository-wide future-module universality claim.\n",
          )
          replace_once(
              roadmap,
              "- [ ] Add source versioning and review fields\n",
              "- [x] Add source versioning and review fields — implemented for live Type 2 Decision Graph authority with approved-only lifecycle enforcement; broader unrelated modules retain their own governance reviews.\n",
          )

          rebaseline = "docs/REMAINING_ROADMAP_REBASELINE_2026-09-08.md"
          replace_once(
              rebaseline,
              "| Add source versioning and review fields | **Partial — substantial foundation present** | Rule-pack/evidence and reviewed product-safety authorities carry source/version/review identity. A blanket all-schema/all-module completion claim is not yet proven. |",
              "| Add source versioning and review fields | **Implemented — live Type 2 authority boundary** | `EvidenceReferenceV2.version` is required across live Decision Graph evidence; medication/safety gates, regimen conflicts, insulin-conversion edges, dose/titration protocols, regimen templates, FRC protocol bindings, and reviewed product-safety authorities carry explicit review/version identity where they bear live Type 2 authority. Live gate/conflict/conversion consumers apply only `approved` rules. This does not claim universal governance for unrelated modules or future schemas. |",
          )
          replace_once(
              rebaseline,
              "With live Type 2 precedence, compatibility-score boundaries, and rule-metadata provenance now formalized, the safest remaining Phase 2 work is governance/consolidation: audit source versioning/review fields, close only proven minimum-safe-input gaps with active consumers, and define clinician-approved golden-case governance. New clinical values still require exact reviewed evidence.",
              "With live Type 2 precedence, compatibility-score boundaries, rule-metadata provenance, and source/review lifecycle now formalized, the safest remaining Phase 2 work is governance/consolidation: close only proven minimum-safe-input gaps with active consumers, complete the broader hard-block/caution/preference/cost/display separation boundary where still unproven, and define clinician-approved golden-case governance. New clinical values still require exact reviewed evidence.",
          )

          precedence = "docs/architecture/CLINICAL_RULE_PRECEDENCE.md"
          replace_once(
              precedence,
              "- **Create traceable rule metadata:** substantial versioned rule/evidence infrastructure exists, but universal coverage across every future rule family is not yet proven.",
              "- **Create traceable rule metadata:** implemented for live Type 2 authority; stable identity and reviewed evidence provenance are formalized, without claiming universal coverage across unrelated future rule families.",
          )
          replace_once(
              precedence,
              "- **Add source versioning and review fields:** substantial coverage exists, but universal schema coverage is not yet proven.",
              "- **Add source versioning and review fields:** implemented for live Type 2 authority; evidence versions are required and decision-bearing gate/conflict/conversion consumers are approved-only, without claiming universal schema coverage outside that authority boundary.",
          )
          PY
          git diff --check

      - name: Assert only qualified Phase 2 items closed
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- '- [x] Create traceable rule metadata — implemented for live Type 2 Decision Graph authority' docs/PROJECT_OVERVIEW_AND_ROADMAP.md
          grep -Fq -- '- [x] Add source versioning and review fields — implemented for live Type 2 Decision Graph authority' docs/PROJECT_OVERVIEW_AND_ROADMAP.md
          grep -Fq -- '- [ ] Separate hard blocks, cautions, preferences, cost, and display' docs/PROJECT_OVERVIEW_AND_ROADMAP.md
          grep -Fq -- '- [ ] Define minimum safe inputs per pathway' docs/PROJECT_OVERVIEW_AND_ROADMAP.md
          grep -Fq -- '- [ ] Add clinical golden cases' docs/PROJECT_OVERVIEW_AND_ROADMAP.md

      - name: Install pinned Codebase Memory
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh -o /tmp/install-cbm.sh
          chmod +x /tmp/install-cbm.sh
          CBM_DOWNLOAD_URL="https://github.com/DeusData/codebase-memory-mcp/releases/download/v${CBM_VERSION}" /tmp/install-cbm.sh --skip-config --dir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Codebase Memory version
        shell: bash
        run: |
          set -euo pipefail
          codebase-memory-mcp --version | tee /tmp/cbm-version.txt
          grep -Fq "${CBM_VERSION}" /tmp/cbm-version.txt

      - name: Run normative POST graph gate on final truth state
        shell: pwsh
        run: ./scripts/codebase-memory-gate.ps1 -Phase post -RoadmapReviewed -GraphRelevant

      - name: Commit verified truth sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "abbaselotfi"
          git config user.email "167691975+abbaselotfi@users.noreply.github.com"
          git add docs/PROJECT_OVERVIEW_AND_ROADMAP.md \
                  docs/REMAINING_ROADMAP_REBASELINE_2026-09-08.md \
                  docs/architecture/CLINICAL_RULE_PRECEDENCE.md
          git diff --cached --check
          git commit -m "docs: close live Type 2 lifecycle roadmap item"
          git push origin HEAD:chore/type2-source-review-lifecycle-20260908
