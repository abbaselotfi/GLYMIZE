name: One-shot remaining roadmap audit

on:
  push:
    branches:
      - 'docs/remaining-roadmap-rebaseline-20260908'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CBM_VERSION: '0.10.8'
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Audit roadmap evidence
        shell: bash
        run: |
          set -euo pipefail
          echo '=== apps/api seed consumers ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git 'ada-2026-type2-seed\|ada2026Type2GenericSeed\|type2ProtocolSeed' apps packages docs || true
          echo '=== admin workflow evidence ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git -E 'Save Draft|save draft|approve|publish|revision|history|restore|discard|reviewer|author' apps/web/app/admin apps/admin-worker/src packages/contracts 2>/dev/null | head -n 300 || true
          echo '=== backend/audit/persistence evidence ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git -E 'audit_log|append-only|DecisionRecord|rule bundle|rule_bundle|rollback|row level security|RLS|tenant' apps packages infra docs/architecture 2>/dev/null | head -n 300 || true
          echo '=== UI/accessibility evidence ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git -E 'WCAG|accessib|aria-|rtl|ltr|font|design system|design-system' apps/web docs 2>/dev/null | head -n 300 || true
          echo '=== validation/release evidence ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git -E 'threat model|security review|privacy|legal|offline|rollback|incident|usability|clinical review|disclaimer' docs .github apps packages 2>/dev/null | head -n 300 || true

      - name: Install pinned Codebase Memory
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh -o /tmp/install-cbm.sh
          chmod +x /tmp/install-cbm.sh
          CBM_DOWNLOAD_URL="https://github.com/DeusData/codebase-memory-mcp/releases/download/v${CBM_VERSION}" \
            /tmp/install-cbm.sh --skip-config --dir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Codebase Memory version
        shell: bash
        run: |
          set -euo pipefail
          codebase-memory-mcp --version | tee /tmp/cbm-version.txt
          grep -Fq "${CBM_VERSION}" /tmp/cbm-version.txt

      - name: Run normative PRE graph gate
        shell: pwsh
        run: ./scripts/codebase-memory-gate.ps1 -Phase pre -RoadmapReviewed -GraphRelevant
