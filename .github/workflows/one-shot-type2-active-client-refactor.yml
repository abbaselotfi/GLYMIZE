name: One-shot Type 2 active client modular refactor

on:
  push:
    branches:
      - feat/type2-active-input-coverage-extraction-20260907
    paths:
      - .github/workflows/one-shot-type2-active-client-refactor.yml

permissions:
  contents: write

jobs:
  refactor-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v7
        with:
          ref: feat/type2-active-input-coverage-extraction-20260907
          fetch-depth: 0

      - name: Apply assertion-guarded modular refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/app/type-2/type2-scenarios-client.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import type {\n  CurrentMedicationInput,\n  GenericMedication,\n',
              'import type {\n  GenericMedication,\n',
              'remove direct CurrentMedicationInput import',
          )

          replace_once(
              '''import {
            emptyType2StructuredIntakeDraft,
            structuredClinicalContextFromDraft,
            type Type2StructuredIntakeDraft,
          } from "./type2-structured-intake-ui";
          ''',
              '''import {
            emptyType2StructuredIntakeDraft,
            type Type2StructuredIntakeDraft,
          } from "./type2-structured-intake-ui";
          import {
            emptyType2CoreContextDraft,
            type2BmiFromCoreDraft,
            type2ClinicalContextFromActiveIntake,
            type2NumberOrUndefined,
            type Type2CoreContextDraft,
          } from "./type2-core-intake-ui";
          import {
            newType2MedicationRow,
            type2CurrentMedicationPayload,
            type Type2MedicationRow,
          } from "./type2-current-medication-ui";
          ''',
              'add modular intake imports',
          )

          types_start = text.index('type MedicationRow = {')
          types_end = text.index('type Type2AssessmentWithParallelSafety', types_start)
          text = text[:types_start] + text[types_end:]

          helper_start = text.index('function numberOrUndefined(value: string)')
          helper_end = text.index('function toman(value?: number', helper_start)
          text = text[:helper_start] + text[helper_end:]

          replace_once(
              'const [medications, setMedications] = useState<MedicationRow[]>([]);',
              'const [medications, setMedications] = useState<Type2MedicationRow[]>([]);',
              'use modular medication row type',
          )

          replace_once(
              '''const [context, setContext] = useState<ContextDraft>({
            eGfr: "", creatinineClearanceMlMin: "", uacr: "", potassiumMmolL: "", dialysis: false, recentAki: false, lvef: "", weight: "", height: "",
            fibrosisStage: "", cirrhosis: false, decompensatedCirrhosis: false,
          });''',
              'const [context, setContext] = useState<Type2CoreContextDraft>({ ...emptyType2CoreContextDraft });',
              'use modular core context draft',
          )

          replace_once(
              '''const bmi = useMemo(() => {
            const weight = numberOrUndefined(context.weight);
            const height = numberOrUndefined(context.height);
            if (!weight || !height) return undefined;
            return Math.round((weight / ((height / 100) ** 2)) * 10) / 10;
          }, [context.height, context.weight]);''',
              'const bmi = useMemo(() => type2BmiFromCoreDraft(context), [context]);',
              'delegate BMI projection',
          )

          replace_once(
              'function updateMedication(id: string, patch: Partial<MedicationRow>) {',
              'function updateMedication(id: string, patch: Partial<Type2MedicationRow>) {',
              'use modular medication patch type',
          )

          payload_start = text.index('  function currentMedicationPayload()')
          payload_end = text.index('  function applyPatientHandoff', payload_start)
          text = text[:payload_start] + text[payload_end:]

          replace_once(
              'currentMedications: currentMedicationPayload(),',
              'currentMedications: type2CurrentMedicationPayload(medications),',
              'delegate current medication payload',
          )

          replace_once(
              'clinicalContext: clinicalContextPayload(),',
              'clinicalContext: type2ClinicalContextFromActiveIntake({ context, structuredContext, factors, worldDrugDomains }),',
              'delegate clinical context projection',
          )

          replace_once(
              'setMedications((current) => [...current, newMedication()])',
              'setMedications((current) => [...current, newType2MedicationRow()])',
              'delegate new medication row creation',
          )

          replace_once(
              'event.target.value as ContextDraft["fibrosisStage"]',
              'event.target.value as Type2CoreContextDraft["fibrosisStage"]',
              'use modular fibrosis-stage type',
          )

          remaining_numeric = text.count('numberOrUndefined(event.target.value)')
          if remaining_numeric != 2:
              raise SystemExit(f'cost fallback numeric parser: expected 2 matches, found {remaining_numeric}')
          text = text.replace('numberOrUndefined(event.target.value)', 'type2NumberOrUndefined(event.target.value)')

          forbidden = [
              'type MedicationRow = {',
              'type ContextDraft = {',
              'function currentMedicationPayload()',
              'function clinicalContextPayload()',
              'function newMedication()',
              'function numberOrUndefined(value: string)',
              'structuredClinicalContextFromDraft,',
              'CurrentMedicationInput,',
          ]
          for marker in forbidden:
              if marker in text:
                  raise SystemExit(f'legacy client-owned intake marker remains: {marker}')

          required = [
              'type2CurrentMedicationPayload(medications)',
              'type2ClinicalContextFromActiveIntake({ context, structuredContext, factors, worldDrugDomains })',
              'newType2MedicationRow()',
              'type2BmiFromCoreDraft(context)',
              'Type2CoreContextDraft["fibrosisStage"]',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'required modular marker missing: {marker}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused Type 2 intake tests
        run: pnpm --filter @glymize/web exec vitest run test/type2-core-intake-ui.test.ts test/type2-current-medication-ui.test.ts test/type2-input-coverage-v2.test.ts

      - name: Typecheck web
        run: pnpm --filter @glymize/web typecheck

      - name: Lint web
        run: pnpm --filter @glymize/web lint

      - name: Verify diff and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-type2-active-client-refactor.yml
          git diff --check
          git status --short
          test -n "$(git status --short apps/web/app/type-2/type2-scenarios-client.tsx)"

      - name: Commit verified client refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/type-2/type2-scenarios-client.tsx .github/workflows/one-shot-type2-active-client-refactor.yml
          git commit -m "Use modular Type 2 active intake projections"
          git push origin HEAD:feat/type2-active-input-coverage-extraction-20260907
