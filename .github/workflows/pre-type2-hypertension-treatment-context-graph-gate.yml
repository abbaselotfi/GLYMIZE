name: PRE Type 2 hypertension treatment context graph gate

on:
  push:
    branches:
      - feat/type2-hypertension-treatment-context-20260907

permissions:
  contents: write

jobs:
  graph-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CBM_VERSION: '0.10.8'
      SNAPSHOT_TAG: codebase-memory-latest
      EXPECTED_MAIN: '427f2603aae3569f045e43553b9eb302218517e4'
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify clean baseline and canonical tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse codebase-memory-latest^{commit})" = "$EXPECTED_MAIN"
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          test "$changed" = '.github/workflows/pre-type2-hypertension-treatment-context-graph-gate.yml'

      - name: Install pinned Codebase Memory
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh -o /tmp/install-cbm.sh
          chmod +x /tmp/install-cbm.sh
          CBM_DOWNLOAD_URL="https://github.com/DeusData/codebase-memory-mcp/releases/download/v${CBM_VERSION}" \
            /tmp/install-cbm.sh --skip-config --dir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/codebase-memory-mcp" --version | tee /tmp/cbm-version.txt
          grep -Fq "$CBM_VERSION" /tmp/cbm-version.txt

      - name: Bootstrap canonical release snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cbm-snapshot
          mkdir -p /tmp/cbm-snapshot
          gh release download "$SNAPSHOT_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'codebase-memory-snapshot.tar.gz' \
            --pattern 'snapshot-source.json' \
            --dir /tmp/cbm-snapshot
          test -s /tmp/cbm-snapshot/codebase-memory-snapshot.tar.gz
          test "$(jq -r '.source_sha // empty' /tmp/cbm-snapshot/snapshot-source.json)" = "$EXPECTED_MAIN"
          test "$(jq -r '.codebase_memory_version // empty' /tmp/cbm-snapshot/snapshot-source.json)" = "$CBM_VERSION"
          tar -xzf /tmp/cbm-snapshot/codebase-memory-snapshot.tar.gz
          test -s .codebase-memory/graph.db.zst
          test -s .codebase-memory/artifact.json
          project="$(jq -r '.project // empty' .codebase-memory/artifact.json)"
          test -n "$project"
          mkdir -p "$HOME/.cache/codebase-memory-mcp"
          zstd -d -f .codebase-memory/graph.db.zst -o "$HOME/.cache/codebase-memory-mcp/${project}.db"
          printf '%s' "$project" > /tmp/cbm-project

      - name: Remove one-shot file before baseline graph check
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pre-type2-hypertension-treatment-context-graph-gate.yml
          rm -f snapshot-source.json
          git diff --quiet origin/main -- .

      - name: Verify canonical graph baseline
        shell: bash
        run: |
          set -euo pipefail
          project="$(cat /tmp/cbm-project)"
          codebase-memory-mcp cli --json index_status "{\"project\":\"${project}\"}" | tee /tmp/cbm-status.json
          grep -Fq '\"status\":\"ready\"' /tmp/cbm-status.json
          codebase-memory-mcp cli --json detect_changes "{\"project\":\"${project}\",\"repo_path\":\"${GITHUB_WORKSPACE}\"}" | tee /tmp/cbm-pre.json
          test -s /tmp/cbm-pre.json

      - name: Cleanup generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f .codebase-memory/graph.db.zst .codebase-memory/artifact.json .codebase-memory/.gitattributes snapshot-source.json
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -v '^.github/workflows/pre-type2-hypertension-treatment-context-graph-gate.yml$' || true)"
          test -z "$unexpected" || { echo "Unexpected cleanup files:"; printf '%s\n' "$unexpected"; exit 1; }

      - name: Commit one-shot workflow removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/pre-type2-hypertension-treatment-context-graph-gate.yml
          git diff --cached --check
          git commit -m "Remove completed PRE hypertension treatment context graph gate"
          git push origin HEAD:${GITHUB_REF_NAME}
