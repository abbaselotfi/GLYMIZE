name: One-shot Phase 6 contract equivalence final validation

on:
  push:
    branches:
      - test/phase6-contract-equivalence-coverage-20260908
    paths:
      - .github/workflows/phase6-contract-equivalence-finalize-oneshot.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CBM_VERSION: 0.10.8
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v4
        with:
          ref: test/phase6-contract-equivalence-coverage-20260908
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API dependency closure
        run: pnpm turbo run build --filter=@glymize/api...
      - name: Test API compatibility contract
        run: pnpm --filter @glymize/api test
      - name: Typecheck monorepo
        run: pnpm typecheck
      - name: Lint monorepo
        run: pnpm lint
      - name: Test monorepo
        run: pnpm test
      - name: Install pinned Codebase Memory
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh -o /tmp/install-cbm.sh
          chmod +x /tmp/install-cbm.sh
          CBM_DOWNLOAD_URL="https://github.com/DeusData/codebase-memory-mcp/releases/download/v${CBM_VERSION}" /tmp/install-cbm.sh --skip-config --dir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify Codebase Memory version
        shell: bash
        run: |
          set -euo pipefail
          codebase-memory-mcp --version | tee /tmp/cbm-version.txt
          grep -Fq "${CBM_VERSION}" /tmp/cbm-version.txt
      - name: Run normative POST graph gate
        shell: pwsh
        run: ./scripts/codebase-memory-gate.ps1 -Phase post -RoadmapReviewed -GraphRelevant
