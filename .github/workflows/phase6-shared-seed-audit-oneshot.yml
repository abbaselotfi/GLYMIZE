name: One-shot Phase 6 shared seed ownership finalizer

on:
  push:
    branches:
      - 'refactor/phase6-shared-seed-ownership-20260908'
    paths:
      - '.github/workflows/phase6-shared-seed-audit-oneshot.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CBM_VERSION: '0.10.8'
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply ownership-only migration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/catalog-data/src/global-reference-catalog
          git mv apps/api/src/catalog/ada-2026-type2-seed.ts packages/catalog-data/src/ada-2026-type2-seed.ts
          git mv apps/api/src/catalog/global-reference-catalog/presentations.ts packages/catalog-data/src/global-reference-catalog/presentations.ts
          git mv apps/api/src/catalog/global-reference-catalog/sources.ts packages/catalog-data/src/global-reference-catalog/sources.ts
          git mv apps/api/src/catalog/global-reference-catalog.ts packages/catalog-data/src/global-reference-catalog.ts
          git rm apps/api/src/guidelines/guideline-sources.ts

          cat > packages/catalog-data/package.json <<'JSON'
          {
            "name": "@glymize/catalog-data",
            "version": "0.1.0",
            "private": true,
            "main": "./dist/index.js",
            "types": "./dist/index.d.ts",
            "scripts": {
              "build": "tsc -p tsconfig.json",
              "lint": "biome lint --diagnostic-level=error .",
              "typecheck": "tsc -p tsconfig.json --noEmit"
            },
            "dependencies": {
              "@glymize/contracts": "workspace:*"
            }
          }
          JSON

          cat > packages/catalog-data/tsconfig.json <<'JSON'
          {
            "extends": "../../tsconfig.base.json",
            "compilerOptions": {
              "module": "NodeNext",
              "moduleResolution": "NodeNext",
              "rootDir": "src",
              "outDir": "dist"
            },
            "include": ["src/**/*.ts"]
          }
          JSON

          cat > packages/catalog-data/src/index.ts <<'TS'
          export * from "./ada-2026-type2-seed.js";
          export * from "./global-reference-catalog.js";
          TS

          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected exactly one marker, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "apps/api/src/catalog/catalog.service.ts",
              'import { ada2026Type2GenericSeed, type2ProtocolSeed } from "./ada-2026-type2-seed.js";\nimport { globalReferenceCatalogue, globalReferenceCatalogueSources } from "./global-reference-catalog.js";',
              'import {\n  ada2026Type2GenericSeed,\n  globalReferenceCatalogue,\n  globalReferenceCatalogueSources,\n  type2ProtocolSeed,\n} from "@glymize/catalog-data";',
          )

          replace_once(
              "apps/api/src/guidelines/guideline.service.ts",
              'import { getActiveClinicalRulePack } from "@glymize/clinical-engine";\nimport { guidelineSources } from "./guideline-sources.js";',
              'import {\n  activeGuidelineSources as guidelineSources,\n  getActiveClinicalRulePack,\n} from "@glymize/clinical-engine";',
          )

          replace_once(
              "apps/web/lib/api-client.ts",
              'import { buildType2Assessment, buildType2MedicationConsiderations } from "@glymize/clinical-engine";',
              'import {\n  activeGuidelineSources as guidelineSources,\n  buildType2Assessment,\n  buildType2MedicationConsiderations,\n} from "@glymize/clinical-engine";',
          )
          replace_once(
              "apps/web/lib/api-client.ts",
              'import { ada2026Type2GenericSeed, type2ProtocolSeed } from "../../api/src/catalog/ada-2026-type2-seed";\nimport { globalReferenceCatalogue, globalReferenceCatalogueSources } from "../../api/src/catalog/global-reference-catalog";\nimport { guidelineSources } from "../../api/src/guidelines/guideline-sources";',
              'import {\n  ada2026Type2GenericSeed,\n  globalReferenceCatalogue,\n  globalReferenceCatalogueSources,\n  type2ProtocolSeed,\n} from "@glymize/catalog-data";',
          )

          replace_once(
              "apps/web/test/module-decomposition-equivalence.test.ts",
              '} from "../../api/src/catalog/global-reference-catalog";',
              '} from "@glymize/catalog-data";',
          )

          for path in ["apps/api/package.json", "apps/web/package.json"]:
              p = Path(path)
              data = json.loads(p.read_text(encoding="utf-8"))
              deps = data.setdefault("dependencies", {})
              deps["@glymize/catalog-data"] = "workspace:*"
              data["dependencies"] = dict(sorted(deps.items()))
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          replace_once(
              "docs/architecture/RUNTIME_OF_RECORD.md",
              'Some web build-time imports still reuse catalogue and guideline seed files located under `apps/api/src`. That source-code dependency does not make the NestJS process a production runtime or source of truth. Moving those shared seeds to a neutral package remains planned cleanup.',
              'Shared compiled catalogue/reference seed data now live in the neutral `@glymize/catalog-data` package, while the active guideline-source registry is consumed directly from `@glymize/clinical-engine`. The web build/runtime no longer imports seed modules from `apps/api/src`; the NestJS process remains local-development-only compatibility code and is not promoted into production authority by this cleanup.',
          )

          replace_once(
              "docs/REMAINING_ROADMAP_REBASELINE_2026-09-08.md",
              '| Move shared seeds out of `apps/api` | **Planned** | The accepted Runtime of Record explicitly notes that web build-time code still imports catalogue/guideline seeds from `apps/api/src`; the NestJS process remains local-development-only. |',
              '| Move shared seeds out of `apps/api` | **Implemented — current shared seed boundary** | Shared compiled catalogue/reference seeds now live in `@glymize/catalog-data`, and API/Web consume the active guideline-source registry directly from `@glymize/clinical-engine`. Web runtime/build code no longer imports seed modules from local-development-only `apps/api/src`. |',
          )
          replace_once(
              "docs/REMAINING_ROADMAP_REBASELINE_2026-09-08.md",
              '| Create shared catalogue/rule packages | **Partial** | `packages/clinical-engine` and `packages/contracts` already centralize major clinical/contracts authority, but catalogue seed ownership is still split and has not been fully neutralized. |',
              '| Create shared catalogue/rule packages | **Partial — seed ownership neutralized** | `@glymize/catalog-data`, `packages/clinical-engine`, and `packages/contracts` now provide neutral shared ownership for compiled catalogue/reference seeds, clinical authority, and contracts. Broader authoritative catalogue staging/persistence and universal rule-bundle governance remain separate open architecture work. |',
          )

          replace_once(
              "docs/PROJECT_OVERVIEW_AND_ROADMAP.md",
              'packages/\n  clinical-engine/     Clinical pathway and medication ranking logic\n  contracts/           Shared type-safe contracts',
              'packages/\n  catalog-data/        Shared compiled catalogue/reference seed data\n  clinical-engine/     Clinical pathway and medication ranking logic\n  contracts/           Shared type-safe contracts',
          )
          PY

          git diff --check
          git status --short

      - name: Update workspace lockfile
        shell: bash
        run: pnpm install --lockfile-only

      - name: Install dependencies from updated lockfile
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Prove moved payloads are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          check_same() {
            old="$1"
            new="$2"
            old_sha="$(git show "origin/main:${old}" | sha256sum | awk '{print $1}')"
            new_sha="$(sha256sum "$new" | awk '{print $1}')"
            printf '%s -> %s\n  old=%s\n  new=%s\n' "$old" "$new" "$old_sha" "$new_sha"
            test "$old_sha" = "$new_sha"
          }
          check_same apps/api/src/catalog/ada-2026-type2-seed.ts packages/catalog-data/src/ada-2026-type2-seed.ts
          check_same apps/api/src/catalog/global-reference-catalog.ts packages/catalog-data/src/global-reference-catalog.ts
          check_same apps/api/src/catalog/global-reference-catalog/presentations.ts packages/catalog-data/src/global-reference-catalog/presentations.ts
          check_same apps/api/src/catalog/global-reference-catalog/sources.ts packages/catalog-data/src/global-reference-catalog/sources.ts

      - name: Prove web runtime no longer imports apps api source
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.ts' --include='*.tsx' '(apps/api/src|api/src/|\.\./\.\./api/src)' apps/web/lib apps/web/app; then
            echo 'Web runtime still contains a cross-app apps/api source dependency.' >&2
            exit 1
          fi

      - name: Typecheck monorepo
        shell: bash
        run: pnpm typecheck

      - name: Lint monorepo
        shell: bash
        run: pnpm lint

      - name: Run focused ownership and parity regressions
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @glymize/web exec vitest run \
            test/module-decomposition-equivalence.test.ts \
            test/type2-selected-insurer-wiring.test.ts
          pnpm --filter @glymize/clinical-engine exec vitest run \
            test/type2-api-parallel-safety-contract-v2.test.ts \
            test/type2-live-authority-v2.test.ts

      - name: Test monorepo
        shell: bash
        run: pnpm test

      - name: Install pinned Codebase Memory
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh -o /tmp/install-cbm.sh
          chmod +x /tmp/install-cbm.sh
          CBM_DOWNLOAD_URL="https://github.com/DeusData/codebase-memory-mcp/releases/download/v${CBM_VERSION}" /tmp/install-cbm.sh --skip-config --dir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Codebase Memory version
        shell: bash
        run: |
          set -euo pipefail
          codebase-memory-mcp --version | tee /tmp/cbm-version.txt
          grep -Fq "${CBM_VERSION}" /tmp/cbm-version.txt

      - name: Run normative POST graph gate
        shell: pwsh
        run: ./scripts/codebase-memory-gate.ps1 -Phase post -RoadmapReviewed -GraphRelevant

      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "abbaselotfi"
          git config user.email "167691975+abbaselotfi@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: move shared catalogue seeds out of apps api"
          git push origin HEAD:refactor/phase6-shared-seed-ownership-20260908
