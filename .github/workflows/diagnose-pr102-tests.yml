name: Diagnose PR 102 monorepo tests

on:
  push:
    branches:
      - feat/type2-active-input-coverage-extraction-20260907

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/type2-active-input-coverage-extraction-20260907

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run and print monorepo test output
        shell: bash
        run: |
          set +e
          pnpm test > diagnostic-pr102-test.log 2>&1
          status=$?
          cat diagnostic-pr102-test.log
          printf '\nDIAGNOSTIC_EXIT_CODE=%s\n' "$status"
          exit "$status"
