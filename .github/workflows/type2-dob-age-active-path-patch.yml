name: Type 2 DOB age active-path patch

on:
  push:
    branches:
      - feat/type2-dob-age-safety-intake-20260907

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/type2-dob-age-safety-intake-20260907
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: Apply assertion-guarded active-path patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          client = Path("apps/web/app/type-2/type2-scenarios-client.tsx")
          replace_once(
              client,
              'import type { PatientHandoffRecord } from "@glymize/contracts";',
              'import type { PatientHandoffRecord, PatientLongitudinalSummary } from "@glymize/contracts";',
          )
          replace_once(
              client,
              'import Type2CurrentMedicationRow from "./type2-current-medication-row";\n',
              'import Type2CurrentMedicationRow from "./type2-current-medication-row";\n'
              'import Type2PatientAgeField from "./type2-patient-age-field";\n'
              'import {\n'
              '  emptyType2PatientAgeDraft,\n'
              '  type2PatientAgeDraftFromPatientData,\n'
              '  type Type2PatientAgeDraft,\n'
              '} from "./type2-patient-age-ui";\n',
          )
          replace_once(
              client,
              '  const [structuredContext, setStructuredContext] = useState<Type2StructuredIntakeDraft>({ ...emptyType2StructuredIntakeDraft });\n',
              '  const [structuredContext, setStructuredContext] = useState<Type2StructuredIntakeDraft>({ ...emptyType2StructuredIntakeDraft });\n'
              '  const [patientAge, setPatientAge] = useState<Type2PatientAgeDraft>({ ...emptyType2PatientAgeDraft });\n',
          )
          replace_once(
              client,
              '  function applyPatientHandoff(record: PatientHandoffRecord) {\n    const confirmedLabs = record.labs.filter((item) => item.verification === "confirmed");',
              '  function applyPatientHandoff(record: PatientHandoffRecord, patient?: PatientLongitudinalSummary) {\n'
              '    setPatientAge(type2PatientAgeDraftFromPatientData(record, patient));\n'
              '    const confirmedLabs = record.labs.filter((item) => item.verification === "confirmed");',
          )
          replace_once(
              client,
              '      clinicalContext: type2ClinicalContextFromActiveIntake({ context, structuredContext, factors, worldDrugDomains }),',
              '      clinicalContext: type2ClinicalContextFromActiveIntake({ context, structuredContext, factors, worldDrugDomains, patientAge }),',
          )
          old_a1c = (
              '            <div className={styles.twoCols}>\n'
              '              <Field label={fa ? "HbA1c فعلی" : "Current A1C"} value={currentHba1c} onChange={(value) => { setCurrentHba1c(value); setAssessment(null); }} unit="%" placeholder="8.7" />\n'
              '              <Field label={fa ? "HbA1c هدف" : "Target A1C"} value={targetHba1c} onChange={(value) => { setTargetHba1c(value); setAssessment(null); }} unit="%" placeholder="7.0" />\n'
              '            </div>\n'
          )
          new_a1c = old_a1c + (
              '            <div className={styles.twoCols}>\n'
              '              <Type2PatientAgeField\n'
              '                className={styles.field}\n'
              '                draft={patientAge}\n'
              '                fa={fa}\n'
              '                onDateOfBirthChange={(value) => {\n'
              '                  setPatientAge((currentAge) => ({ ...currentAge, dateOfBirth: value }));\n'
              '                  setAssessment(null);\n'
              '                }}\n'
              '              />\n'
              '            </div>\n'
          )
          replace_once(client, old_a1c, new_a1c)

          lookup = Path("apps/web/app/components/patient-handoff-lookup.tsx")
          replace_once(
              lookup,
              'export default function PatientHandoffLookup({ onApply }: { onApply: (record: PatientHandoffRecord) => void }) {',
              'export default function PatientHandoffLookup({ onApply }: { onApply: (record: PatientHandoffRecord, patient: PatientLongitudinalSummary | undefined) => void }) {',
          )
          replace_once(lookup, '              onApply(record);', '              onApply(record, selection.patient);')

          coverage = Path("apps/web/app/type-2/type2-input-coverage-v2.ts")
          old_coverage = (
              '  "core.age_years": {\n'
              '    state: "not_collected",\n'
              '    surface: "none",\n'
              '    note: "The request contract supports ageYears, but the active Type 2 clinician form does not collect it; longitudinal demographic design should prefer date of birth rather than adding a static patient age here.",\n'
              '  },'
          )
          new_coverage = (
              '  "core.age_years": {\n'
              '    state: "derived",\n'
              '    surface: "core_form",\n'
              '    note: "The active Type 2 form derives age deterministically from explicit date of birth. Patient Record v2 longitudinal DOB has precedence; a handoff-reported age is used only when its field provenance is confirmed. Unknown age remains absent and age-dependent gates stay fail-closed.",\n'
              '  },'
          )
          replace_once(coverage, old_coverage, new_coverage)

          coverage_test = Path("apps/web/test/type2-input-coverage-v2.test.ts")
          replace_once(
              coverage_test,
              '  it("keeps request-supported age uncollected while marking explicit DPN safety facts collected", () => {\n    expect(type2UiInputCoverageV2["core.age_years"].state).toBe("not_collected");',
              '  it("marks DOB-derived age and explicit DPN safety facts as represented", () => {\n'
              '    expect(type2UiInputCoverageV2["core.age_years"].state).toBe("derived");\n'
              '    expect(type2UiInputCoverageV2["core.age_years"].surface).toBe("core_form");\n'
              '    expect(type2UiInputCoverageV2["core.age_years"].note?.toLocaleLowerCase()).toContain("date of birth");\n'
              '    expect(type2UiInputCoverageV2["core.age_years"].note?.toLocaleLowerCase()).toContain("fail-closed");',
          )
          replace_once(
              coverage_test,
              '      "core.age_years",\n      "cardiovascular.nyha_class",',
              '      "cardiovascular.nyha_class",',
          )
          replace_once(
              coverage_test,
              '    expect(type2UiInputGapsV2).not.toContain("cardiovascular.systolic_bp");',
              '    expect(type2UiInputGapsV2).not.toContain("core.age_years");\n'
              '    expect(type2UiInputGapsV2).not.toContain("cardiovascular.systolic_bp");',
          )

          core_test = Path("apps/web/test/type2-core-intake-ui.test.ts")
          text = core_test.read_text(encoding="utf-8")
          marker = "\n});\n"
          index = text.rfind(marker)
          if index < 0:
              raise SystemExit("type2-core-intake-ui.test.ts: final describe close not found")
          addition = (
              '\n\n  it("projects DOB-derived age without allowing reported age to override it", () => {\n'
              '    const result = type2ClinicalContextFromActiveIntake({\n'
              '      context: context(),\n'
              '      structuredContext: { ...emptyType2StructuredIntakeDraft },\n'
              '      factors: [],\n'
              '      worldDrugDomains: [],\n'
              '      patientAge: { dateOfBirth: "2000-09-08", confirmedReportedAgeYears: 65 },\n'
              '      ageAsOf: new Date(2026, 8, 7, 12),\n'
              '    });\n\n'
              '    expect(result.ageYears).toBe(25);\n'
              '  });\n'
          )
          core_test.write_text(text[:index] + addition + text[index:], encoding="utf-8")
          PY

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies for web tests
        run: |
          pnpm --filter @glymize/contracts build
          pnpm --filter @glymize/clinical-engine build

      - name: Run focused DOB age tests
        run: |
          pnpm --filter @glymize/web test -- test/type2-patient-age-ui.test.ts test/type2-core-intake-ui.test.ts test/type2-input-coverage-v2.test.ts

      - name: Typecheck web
        run: pnpm --filter @glymize/web typecheck

      - name: Lint web
        run: pnpm --filter @glymize/web lint

      - name: Verify diff hygiene
        run: git diff --check

      - name: Commit verified source and self-remove workflow
        run: |
          rm .github/workflows/type2-dob-age-active-path-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/app/components/patient-handoff-lookup.tsx \
            apps/web/app/type-2/type2-scenarios-client.tsx \
            apps/web/app/type-2/type2-input-coverage-v2.ts \
            apps/web/test/type2-core-intake-ui.test.ts \
            apps/web/test/type2-input-coverage-v2.test.ts
          git add -u .github/workflows/type2-dob-age-active-path-patch.yml
          git commit -m "Wire DOB-first age into active Type 2 intake"
          git push origin HEAD:feat/type2-dob-age-safety-intake-20260907
