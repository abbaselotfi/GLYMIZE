name: One-shot Type 2 rule metadata finalize

on:
  push:
    branches:
      - 'chore/type2-rule-metadata-traceability-20260908'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CBM_VERSION: '0.10.8'
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Truth-sync Phase 2 roadmap
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/REMAINING_ROADMAP_REBASELINE_2026-09-08.md')
          s = p.read_text(encoding='utf-8')
          old = '| Create traceable rule metadata | **Partial — substantial foundation present** | Versioned Rule Pack, evidence registry, product-dose rules, safety rules, reviewed product-safety registry and Evidence Assistant indexing provide direct provenance. Remaining work is to make this expectation universal for every clinical rule family. |'
          new = '| Create traceable rule metadata | **Implemented — live Type 2 authority boundary** | `docs/architecture/CLINICAL_RULE_METADATA.md` defines the provenance contract. Guideline-derived live Type 2 objectives, clinical missing-data requirements, hard/safety rules, dose/titration protocols, and reviewed product-safety sets now carry stable identity plus reviewed evidence metadata; intentionally evidence-empty neutral/request-policy structures are explicitly documented and regression-tested. This status does not claim universal metadata governance for unrelated future modules. |'
          if old not in s:
              raise SystemExit('expected roadmap metadata row not found')
          s = s.replace(old, new, 1)
          old2 = 'With live Type 2 precedence formalized and retained score mechanics now named/bounded, the safest remaining Phase 2 work is governance/consolidation: broaden traceable rule/input/version metadata only where evidence shows a real gap, and define clinician-approved golden-case governance. New clinical values still require exact reviewed evidence.'
          new2 = 'With live Type 2 precedence, compatibility-score boundaries, and rule-metadata provenance now formalized, the safest remaining Phase 2 work is governance/consolidation: audit source versioning/review fields, close only proven minimum-safe-input gaps with active consumers, and define clinician-approved golden-case governance. New clinical values still require exact reviewed evidence.'
          if old2 not in s:
              raise SystemExit('expected Phase 2 next-engineering paragraph not found')
          p.write_text(s.replace(old2, new2, 1), encoding='utf-8')

      - name: Assert metadata-only source boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n 'evidence: \[\]' packages/clinical-engine/src/decision-graph-v2/objectives.ts
          test "$(grep -c 'evidence: \[\]' packages/clinical-engine/src/decision-graph-v2/adaptive-data.ts)" -eq 1
          grep -A6 'key: "preferences.insuranceProviders"' packages/clinical-engine/src/decision-graph-v2/adaptive-data.ts | grep -Fq 'evidence: []'
          grep -Fq 'export const kdigoDmCkd2022' packages/clinical-engine/src/decision-graph-v2/safety-rules.ts

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts dependency
        run: pnpm --filter @glymize/contracts build

      - name: Typecheck clinical engine
        run: pnpm --filter @glymize/clinical-engine typecheck

      - name: Run focused metadata regression
        run: pnpm --filter @glymize/clinical-engine exec vitest run test/type2-rule-metadata-traceability-v2.test.ts test/decision-graph-v2.test.ts

      - name: Commit roadmap truth-sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'abbaselotfi'
          git config user.email '167691975+abbaselotfi@users.noreply.github.com'
          git add docs/REMAINING_ROADMAP_REBASELINE_2026-09-08.md
          if git diff --cached --quiet; then
            echo 'No roadmap change to commit'
          else
            git commit -m 'docs: close live Type 2 rule metadata roadmap item'
            git push origin HEAD:chore/type2-rule-metadata-traceability-20260908
          fi

      - name: Install pinned Codebase Memory
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh -o /tmp/install-cbm.sh
          chmod +x /tmp/install-cbm.sh
          CBM_DOWNLOAD_URL="https://github.com/DeusData/codebase-memory-mcp/releases/download/v${CBM_VERSION}" /tmp/install-cbm.sh --skip-config --dir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Codebase Memory version
        shell: bash
        run: |
          set -euo pipefail
          codebase-memory-mcp --version | tee /tmp/cbm-version.txt
          grep -Fq "${CBM_VERSION}" /tmp/cbm-version.txt

      - name: Run normative POST graph gate
        shell: pwsh
        run: ./scripts/codebase-memory-gate.ps1 -Phase post -RoadmapReviewed -GraphRelevant
