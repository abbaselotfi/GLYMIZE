name: One-shot Type 2 legacy score policy recovery

on:
  push:
    branches:
      - 'chore/type2-legacy-score-policy-20260908'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CBM_VERSION: '0.10.8'
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply behavior-preserving score-policy patch
        shell: bash
        run: python scripts/type2-legacy-score-policy-finalize.py

      - name: Verify source diff and score boundaries
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -Fq 'let score = 50;' packages/clinical-engine/src/index.ts
          ! grep -Fq 'adjustedClinicalScore(item, request) >= 58' packages/clinical-engine/src/scenario-engine.ts
          ! grep -Fq 'score += 3;' packages/clinical-engine/src/evidence-assistant.ts
          ! grep -RIn --include='*.ts' 'type2-legacy-score-policy' packages/clinical-engine/src/decision-graph-v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Typecheck clinical engine
        shell: bash
        run: pnpm --filter @glymize/clinical-engine typecheck

      - name: Run focused compatibility regression
        shell: bash
        run: pnpm --filter @glymize/clinical-engine exec vitest run test/type2-legacy-score-policy-v2.test.ts test/type2-scenario-suite.test.ts test/type2-live-authority-v2.test.ts

      - name: Commit final source and documentation state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/clinical-engine/src/index.ts packages/clinical-engine/src/scenario-engine.ts packages/clinical-engine/src/evidence-assistant.ts docs/PROJECT_OVERVIEW_AND_ROADMAP.md docs/REMAINING_ROADMAP_REBASELINE_2026-09-08.md docs/architecture/CLINICAL_RULE_PRECEDENCE.md
          git commit -m 'refactor: centralize non-authoritative score mechanics'

      - name: Install pinned Codebase Memory
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh -o /tmp/install-cbm.sh
          chmod +x /tmp/install-cbm.sh
          CBM_DOWNLOAD_URL="https://github.com/DeusData/codebase-memory-mcp/releases/download/v${CBM_VERSION}" /tmp/install-cbm.sh --skip-config --dir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Codebase Memory version
        shell: bash
        run: |
          set -euo pipefail
          codebase-memory-mcp --version | tee /tmp/cbm-version.txt
          grep -Fq "${CBM_VERSION}" /tmp/cbm-version.txt

      - name: Run normative POST graph gate
        shell: pwsh
        run: ./scripts/codebase-memory-gate.ps1 -Phase post -RoadmapReviewed -GraphRelevant

      - name: Remove temporary recovery files and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/type2-legacy-score-policy-recover-oneshot.yml scripts/type2-legacy-score-policy-finalize.py
          git commit -m 'ci: remove completed legacy score recovery files'
          git push origin HEAD:chore/type2-legacy-score-policy-20260908
