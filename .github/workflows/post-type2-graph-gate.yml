name: POST Type 2 Codebase Memory gate

on:
  push:
    branches:
      - feat/type2-trusted-claim-policy-boundary-20260907

permissions:
  contents: write

jobs:
  graph-gate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CBM_VERSION: '0.10.8'
      SNAPSHOT_TAG: codebase-memory-latest
    steps:
      - name: Checkout final task branch
        uses: actions/checkout@v7
        with:
          ref: feat/type2-trusted-claim-policy-boundary-20260907
          fetch-depth: 0

      - name: Verify task branch contains current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "origin/main=$(git rev-parse origin/main)"

      - name: Install pinned Codebase Memory
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh -o /tmp/install-cbm.sh
          chmod +x /tmp/install-cbm.sh
          CBM_DOWNLOAD_URL="https://github.com/DeusData/codebase-memory-mcp/releases/download/v${CBM_VERSION}" \
            /tmp/install-cbm.sh --skip-config --dir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify generator version
        shell: bash
        run: |
          set -euo pipefail
          codebase-memory-mcp --version | tee /tmp/cbm-version.txt
          grep -Fq "${CBM_VERSION}" /tmp/cbm-version.txt

      - name: Bootstrap canonical main graph snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp .codebase-memory/adr.md /tmp/branch-adr.md
          mkdir -p /tmp/cbm-snapshot
          gh release download "$SNAPSHOT_TAG" \
            --pattern 'codebase-memory-snapshot.tar.gz' \
            --dir /tmp/cbm-snapshot
          tar -xzf /tmp/cbm-snapshot/codebase-memory-snapshot.tar.gz -C "$GITHUB_WORKSPACE"
          cp /tmp/branch-adr.md .codebase-memory/adr.md
          test -s .codebase-memory/graph.db.zst
          test -s .codebase-memory/artifact.json
          test -s .codebase-memory/adr.md
          echo '=== canonical artifact metadata ==='
          cat .codebase-memory/artifact.json

      - name: Materialize canonical graph cache without refreshing
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd >/dev/null
          zstd -dc .codebase-memory/graph.db.zst > /tmp/cbm-main.db
          test -s /tmp/cbm-main.db

          project="$(python3 - <<'PY'
          import sqlite3

          db = sqlite3.connect('/tmp/cbm-main.db')
          tables = [
              row[0]
              for row in db.execute(
                  "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"
              )
          ]
          values = set()
          for table in tables:
              escaped = table.replace('"', '""')
              columns = [row[1] for row in db.execute(f'PRAGMA table_info("{escaped}")')]
              if 'project' not in columns:
                  continue
              for row in db.execute(
                  f'SELECT DISTINCT project FROM "{escaped}" '
                  "WHERE project IS NOT NULL AND project <> ''"
              ):
                  values.add(str(row[0]))
          db.close()
          for value in sorted(values):
              print(value)
          PY
          )"

          test -n "$project"
          test "$(printf '%s\n' "$project" | wc -l)" -eq 1
          mkdir -p "$HOME/.cache/codebase-memory-mcp"
          cp /tmp/cbm-main.db "$HOME/.cache/codebase-memory-mcp/${project}.db"
          echo "CBM_PROJECT=$project" >> "$GITHUB_ENV"
          echo "CBM project from canonical artifact: $project"

          codebase-memory-mcp cli list_projects | tee /tmp/cbm-projects.txt
          json_line="$(grep -E '^\{' /tmp/cbm-projects.txt | tail -n 1)"
          test -n "$json_line"
          jq -e --arg project "$project" '.projects[] | select(.name == $project)' <<<"$json_line"

      - name: Detect graph delta before refresh
        shell: bash
        run: |
          set -euo pipefail
          echo '=== detect_changes BEFORE refresh ==='
          codebase-memory-mcp cli detect_changes --project "$CBM_PROJECT" | tee /tmp/cbm-detect-before.txt
          echo '=== index_status BEFORE refresh ==='
          codebase-memory-mcp cli index_status --project "$CBM_PROJECT" | tee /tmp/cbm-status-before.txt

      - name: Update Codebase Memory ADR through manage_adr
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg project "$CBM_PROJECT" --rawfile content .codebase-memory/adr.md '{project:$project,mode:"update",content:$content}')"
          codebase-memory-mcp cli manage_adr "$payload"
          grep -Fq 'Reviewed Type 2 insurance claim-timing authority' .codebase-memory/adr.md

      - name: Refresh graph from final branch source
        shell: bash
        run: |
          set -euo pipefail
          codebase-memory-mcp cli --progress index_repository \
            --repo-path "$GITHUB_WORKSPACE" \
            --mode full \
            --persistence true
          test -s .codebase-memory/graph.db.zst
          test -s .codebase-memory/artifact.json
          test -s .codebase-memory/adr.md

      - name: Verify post-refresh graph status and scope
        shell: bash
        run: |
          set -euo pipefail
          codebase-memory-mcp cli list_projects | tee /tmp/cbm-projects-after.txt
          json_line="$(grep -E '^\{' /tmp/cbm-projects-after.txt | tail -n 1)"
          project="$(jq -r --arg root "$GITHUB_WORKSPACE" '.projects[] | select((.root_path | gsub("\\\\"; "/")) == $root) | .name' <<<"$json_line" | head -n 1)"
          test -n "$project"
          echo '=== index_status AFTER refresh ==='
          codebase-memory-mcp cli index_status --project "$project"
          echo '=== final Git blast radius ==='
          git diff --name-status origin/main...HEAD
          echo 'ROADMAP + GRAPH GATE [post]: PASS'

      - name: Remove one-shot graph workflow
        shell: bash
        run: rm -f .github/workflows/post-type2-graph-gate.yml

      - name: Ensure graph binaries remain untracked
        shell: bash
        run: |
          set -euo pipefail
          if git status --short | grep -E 'graph\.db\.zst|artifact\.json'; then
            echo 'Graph binary/metadata unexpectedly became trackable.' >&2
            exit 1
          fi
          git diff --check

      - name: Commit one-shot workflow removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'Complete POST Codebase Memory gate'
            git push origin HEAD:feat/type2-trusted-claim-policy-boundary-20260907
          fi
