name: One-shot Phase 6 remaining schema boundary audit

on:
  push:
    branches:
      - audit/phase6-schema-version-coverage-20260908
    paths:
      - .github/workflows/phase6-schema-remaining-audit-oneshot.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CBM_VERSION: 0.10.8
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v4
        with:
          ref: audit/phase6-schema-version-coverage-20260908
          fetch-depth: 0

      - name: Install pinned Codebase Memory
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh -o /tmp/install-cbm.sh
          chmod +x /tmp/install-cbm.sh
          CBM_DOWNLOAD_URL="https://github.com/DeusData/codebase-memory-mcp/releases/download/v${CBM_VERSION}" /tmp/install-cbm.sh --skip-config --dir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Codebase Memory version
        shell: bash
        run: |
          set -euo pipefail
          codebase-memory-mcp --version | tee /tmp/cbm-version.txt
          grep -Fq "${CBM_VERSION}" /tmp/cbm-version.txt

      - name: Run normative PRE graph gate
        shell: pwsh
        run: ./scripts/codebase-memory-gate.ps1 -Phase pre -RoadmapReviewed -GraphRelevant

      - name: Inventory browser persistence boundaries
        shell: bash
        run: |
          echo '=== browser persistence ==='
          grep -RInE 'localStorage|sessionStorage|indexedDB|CacheStorage|caches\.' apps/web packages --include='*.ts' --include='*.tsx' || true

      - name: Inventory Worker KV and R2 persistence boundaries
        shell: bash
        run: |
          echo '=== worker KV/R2 writes and JSON persistence ==='
          grep -RInE '\.put\(|JSON\.stringify|JSON\.parse|R2|KV' apps/admin-worker/src --include='*.ts' || true

      - name: Inventory active static JSON readers
        shell: bash
        run: |
          echo '=== static/runtime JSON readers ==='
          grep -RInE 'fetch\(|\.json\(\)|JSON\.parse' apps/web/lib apps/web/app packages --include='*.ts' --include='*.tsx' || true

      - name: Inventory public JSON artifacts
        shell: bash
        run: |
          echo '=== public json artifacts ==='
          find apps/web/public -type f -name '*.json' -print 2>/dev/null | sort || true

      - name: Inventory explicit version markers around persistence
        shell: bash
        run: |
          echo '=== version markers ==='
          grep -RInE 'schemaVersion|schema_version|runtimeSchemaVersion|storageVersion|formatVersion|kind:' apps/web apps/admin-worker packages --include='*.ts' --include='*.tsx' || true
