name: One-shot Phase 6 AI preview schema PRE gate

on:
  push:
    branches:
      - chore/phase6-ai-preview-schema-versioning-20260908

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v4
        with:
          ref: chore/phase6-ai-preview-schema-versioning-20260908
          fetch-depth: 0
      - name: Install Codebase Memory v0.10.8
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/v0.10.8/install.sh | bash -s -- --skip-config
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify Codebase Memory version
        shell: bash
        run: |
          set -euo pipefail
          codebase-memory-mcp --version
      - name: Run normative PRE graph gate
        shell: pwsh
        run: ./scripts/codebase-memory-gate.ps1 -Phase pre -RoadmapReviewed
