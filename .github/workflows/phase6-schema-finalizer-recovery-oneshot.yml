name: One-shot Phase 6 schema finalizer recovery

on:
  push:
    branches:
      - audit/phase6-schema-version-coverage-20260908
    paths:
      - .github/workflows/phase6-schema-finalizer-recovery-oneshot.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize finalizer marker only
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path("apps/web/lib/clinician-market-v2.ts"); t=p.read_text(encoding="utf-8"); old="      if (metaResponse.ok) {\n        const meta = await metaResponse.json() as { deploymentSha256?: string; canonicalSha256?: string };\n        runtimeVersion = meta.deploymentSha256 ?? meta.canonicalSha256 ?? runtimeVersion;\n      }\n"; new="      if (metaResponse.ok) {\n          const meta = await metaResponse.json() as { deploymentSha256?: string; canonicalSha256?: string };\n          runtimeVersion = meta.deploymentSha256 ?? meta.canonicalSha256 ?? runtimeVersion;\n        }\n"; assert old in t, "clinician-market metadata marker not found"; p.write_text(t.replace(old,new,1),encoding="utf-8")'

      - name: Commit marker normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name abbaselotfi
          git config user.email 167691975+abbaselotfi@users.noreply.github.com
          git add apps/web/lib/clinician-market-v2.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore: normalize schema finalizer marker"
          git push origin HEAD:audit/phase6-schema-version-coverage-20260908
