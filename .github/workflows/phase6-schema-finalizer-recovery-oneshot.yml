name: One-shot Phase 6 schema finalizer recovery

on:
  push:
    branches:
      - audit/phase6-schema-version-coverage-20260908
    paths:
      - .github/workflows/phase6-schema-finalizer-recovery-oneshot.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      CBM_VERSION: 0.10.8
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Apply finalizer patch definition
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; s=Path(".github/workflows/phase6-schema-version-audit-oneshot.yml").read_text(encoding="utf-8"); a=s.index("          python - <<"); a=s.index("\n",a)+1; b=s.index("\n          PY",a); body=s[a:b]; Path("/tmp/apply_schema.py").write_text("\n".join((line[10:] if line.startswith("          ") else line) for line in body.splitlines())+"\n",encoding="utf-8")'
          python /tmp/apply_schema.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck monorepo first
        run: pnpm typecheck

      - name: Focused schema-version regressions
        run: pnpm --filter @glymize/web exec vitest run test/schema-version-boundaries.test.ts test/module-decomposition-equivalence.test.ts

      - name: Lint monorepo
        run: pnpm lint

      - name: Test monorepo
        run: pnpm test

      - name: Install pinned Codebase Memory
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh -o /tmp/install-cbm.sh
          chmod +x /tmp/install-cbm.sh
          CBM_DOWNLOAD_URL="https://github.com/DeusData/codebase-memory-mcp/releases/download/v${CBM_VERSION}" /tmp/install-cbm.sh --skip-config --dir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Codebase Memory version
        shell: bash
        run: |
          set -euo pipefail
          codebase-memory-mcp --version | tee /tmp/cbm-version.txt
          grep -Fq "${CBM_VERSION}" /tmp/cbm-version.txt

      - name: Run normative POST graph gate
        shell: pwsh
        run: ./scripts/codebase-memory-gate.ps1 -Phase post -RoadmapReviewed -GraphRelevant

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name abbaselotfi
          git config user.email 167691975+abbaselotfi@users.noreply.github.com
          git add \
            apps/web/lib/catalog/browser-catalog-state.ts \
            apps/web/lib/clinician-market-v2.ts \
            apps/web/test/schema-version-boundaries.test.ts \
            docs/architecture/SCHEMA_VERSIONING.md \
            docs/architecture/RUNTIME_OF_RECORD.md \
            docs/REMAINING_ROADMAP_REBASELINE_2026-09-08.md
          git diff --cached --check
          git commit -m "chore: enforce persisted schema version boundaries"
          git push origin HEAD:audit/phase6-schema-version-coverage-20260908
