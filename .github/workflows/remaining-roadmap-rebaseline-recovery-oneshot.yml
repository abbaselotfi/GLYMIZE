name: One-shot remaining-roadmap rebaseline recovery

on:
  push:
    branches:
      - 'docs/remaining-roadmap-rebaseline-20260908'

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CBM_VERSION: '0.10.8'
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: docs/remaining-roadmap-rebaseline-20260908

      - name: Patch roadmap and current-state pointers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/PROJECT_OVERVIEW_AND_ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')

          old_checkbox = '- [ ] Clarify runtime source of truth'
          new_checkbox = '- [x] Clarify runtime source of truth'
          if text.count(old_checkbox) != 1:
              raise SystemExit(f'expected exactly one Phase 6 runtime-source checkbox, found {text.count(old_checkbox)}')
          text = text.replace(old_checkbox, new_checkbox, 1)

          start = text.index('## 11. Immediate next task')
          end = text.index('\n---\n\n## 12. Change log', start)
          new_section = '''## 11. Immediate next task

          The accepted numbered convergence sequence is complete, and the remaining Phase 1, Phase 2, and Phase 5–10 backlog has now been re-baselined against `main@9db6677579c7d239c498098d087ecbe0c3af8b50` in [`REMAINING_ROADMAP_REBASELINE_2026-09-08.md`](REMAINING_ROADMAP_REBASELINE_2026-09-08.md).

          The re-baseline intentionally distinguishes `implemented`, `partial`, `owner decision required`, and `planned / deferred`; broad roadmap checkboxes remain open when only part of their meaning is implemented. Phase 6 `Clarify runtime source of truth` is closed because the accepted Runtime of Record and Clinical Engine Authority documents already establish the active authorities.

          The immediate implementation-ready task that does **not** require an unresolved product decision is:

          > **Phase 2 closure audit — formalize the live clinical precedence model and retained legacy-score compatibility boundary without changing clinical behavior.**

          The task must:

          - document the current precedence from structured patient facts through hard exclusion, mandatory objectives, approved protocol/dose execution, composition/diversity, access/cost tie-breaks, and display;
          - enumerate every remaining consumer of the unconfigured legacy score builder before proposing deletion;
          - add or strengthen a regression guard so the compatibility score path cannot regain physician-facing authority;
          - identify which Phase 2 checklist items can then be closed and which still require clinician-governed golden cases;
          - make no new clinical threshold, product-eligibility, dose, evidence, ranking, feature-activation, migration, or deployment change.

          Phase 1 V1 scope, GLP-1/weight visibility, insulin-conversion launch priority, and the proposed D1 catalogue-persistence migration remain explicit owner decisions and must not be inferred from existing code. `cardiovascular.nyha_class` also remains uncollected until a real downstream consumer exists.
          '''
          new_section = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_section.splitlines())
          text = text[:start] + new_section + text[end:]

          change_anchor = '### 2026-09-08\n\n'
          change_note = ('- Re-baselined every still-open Phase 1, Phase 2, and Phase 5–10 item in '
                         '`docs/REMAINING_ROADMAP_REBASELINE_2026-09-08.md`; closed only the already-proven Phase 6 runtime-source-of-truth item and set the next independent task to the Phase 2 precedence/legacy-score closure audit.\n')
          if change_anchor not in text:
              raise SystemExit('2026-09-08 changelog anchor not found')
          text = text.replace(change_anchor, change_anchor + change_note, 1)
          roadmap.write_text(text, encoding='utf-8')

          current = Path('docs/CURRENT_STATE.md')
          ctext = current.read_text(encoding='utf-8')
          marker = 'This document is a factual repository snapshot, not a product promise or replacement for the ordered [Project Overview and Roadmap](PROJECT_OVERVIEW_AND_ROADMAP.md).'
          addition = (' The remaining open roadmap families are status-classified in '
                      '[Remaining Roadmap Re-baseline](REMAINING_ROADMAP_REBASELINE_2026-09-08.md); that audit does not convert implemented code into V1 scope or deployment claims.')
          if marker not in ctext:
              raise SystemExit('CURRENT_STATE introduction marker not found')
          if 'Remaining Roadmap Re-baseline' not in ctext:
              ctext = ctext.replace(marker, marker + addition, 1)
          current.write_text(ctext, encoding='utf-8')
          PY

      - name: Verify documentation diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- docs/PROJECT_OVERVIEW_AND_ROADMAP.md docs/CURRENT_STATE.md

      - name: Commit documentation state for graph audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_OVERVIEW_AND_ROADMAP.md docs/CURRENT_STATE.md
          git commit -m 'docs: link remaining-roadmap rebaseline and next task'

      - name: Install pinned Codebase Memory
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh -o /tmp/install-cbm.sh
          chmod +x /tmp/install-cbm.sh
          CBM_DOWNLOAD_URL="https://github.com/DeusData/codebase-memory-mcp/releases/download/v${CBM_VERSION}" \
            /tmp/install-cbm.sh --skip-config --dir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Codebase Memory version
        shell: bash
        run: |
          set -euo pipefail
          codebase-memory-mcp --version | tee /tmp/cbm-version.txt
          grep -Fq "${CBM_VERSION}" /tmp/cbm-version.txt

      - name: Run final post graph gate
        shell: pwsh
        run: ./scripts/codebase-memory-gate.ps1 -Phase post -RoadmapReviewed -GraphRelevant

      - name: Remove one-shot workflows and push final branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/remaining-roadmap-rebaseline-post-oneshot.yml
          git rm .github/workflows/remaining-roadmap-rebaseline-recovery-oneshot.yml
          git commit -m 'ci: remove completed remaining-roadmap one-shot workflows'
          git push origin HEAD:docs/remaining-roadmap-rebaseline-20260908
