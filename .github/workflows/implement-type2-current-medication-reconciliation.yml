name: Implement Type 2 current medication reconciliation

on:
  push:
    branches:
      - feat/type2-current-medication-reconciliation-20260907

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Wire dedicated medication row into scenario shell
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/web/app/type-2/type2-scenarios-client.tsx")
          source = path.read_text()
          old_import = '''import {
            newType2MedicationRow,
            type2CurrentMedicationPayload,
            type Type2MedicationRow,
          } from "./type2-current-medication-ui";
          import base from "./type2-v2.module.css";'''
          new_import = '''import {
            newType2MedicationRow,
            type2CurrentMedicationPayload,
            type Type2MedicationRow,
          } from "./type2-current-medication-ui";
          import Type2CurrentMedicationRow from "./type2-current-medication-row";
          import base from "./type2-v2.module.css";'''
          if source.count(old_import) != 1:
              raise SystemExit("expected current-medication import block exactly once")
          source = source.replace(old_import, new_import)
          old_rows = '''              {medications.map((item, index) => <div className={styles.currentMed} key={item.id}>
                <div className={styles.medIndex}>{index + 1}</div>
                <label><span>{fa ? "دارو" : "Medicine"}</span><input list="type2-drugs" value={item.genericName} onChange={(event) => updateMedicationName(item.id, event.target.value)} placeholder="Metformin" /></label>
                <label><span>{fa ? "دوز هر نوبت" : "Dose"}</span><input type="number" min="0" step="0.1" value={item.doseAmount} onChange={(event) => updateMedication(item.id, { doseAmount: event.target.value })} /></label>
                <label><span>{fa ? "واحد" : "Unit"}</span><select value={item.doseUnit} onChange={(event) => updateMedication(item.id, { doseUnit: event.target.value })}><option>mg</option><option>g</option><option>mcg</option><option>unit</option><option>mL</option><option>tablet</option><option>capsule</option><option>actuation</option><option>vial</option><option>ampoule</option><option>pen</option></select></label>
                <label><span>{fa ? "دفعات/روز" : "Times/day"}</span><input type="number" min="0" max="12" step="0.5" value={item.frequencyPerDay} onChange={(event) => updateMedication(item.id, { frequencyPerDay: event.target.value })} /></label>
                <button className={styles.remove} type="button" aria-label={fa ? "حذف دارو" : "Remove medicine"} onClick={() => setMedications((current) => current.filter((row) => row.id !== item.id))}>×</button>
              </div>)}'''
          new_rows = '''              {medications.map((item, index) => <Type2CurrentMedicationRow
                key={item.id}
                item={item}
                index={index}
                locale={locale}
                onChange={(patch) => updateMedication(item.id, patch)}
                onNameChange={(value) => updateMedicationName(item.id, value)}
                onRemove={() => setMedications((current) => current.filter((row) => row.id !== item.id))}
              />)}'''
          if source.count(old_rows) != 1:
              raise SystemExit("expected inline current-medication rows exactly once")
          path.write_text(source.replace(old_rows, new_rows))
          PY
          rm -f .github/workflows/implement-type2-current-medication-reconciliation.yml

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test medication intake projection
        run: pnpm --filter @glymize/web exec vitest run test/type2-current-medication-ui.test.ts

      - name: Typecheck web
        run: pnpm --filter @glymize/web typecheck

      - name: Lint web
        run: pnpm --filter @glymize/web lint

      - name: Commit shell wiring and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/type-2/type2-scenarios-client.tsx
          git add -u .github/workflows/implement-type2-current-medication-reconciliation.yml
          git diff --cached --check
          git commit -m "Wire Type 2 medication reconciliation row"
          git push origin HEAD:${GITHUB_REF_NAME}
