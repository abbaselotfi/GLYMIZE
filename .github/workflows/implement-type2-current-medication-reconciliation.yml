name: Implement Type 2 current medication reconciliation

on:
  push:
    branches:
      - feat/type2-current-medication-reconciliation-20260907

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Wire dedicated medication row into scenario shell
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("apps/web/app/type-2/type2-scenarios-client.tsx")
          source = path.read_text()
          if 'import Type2CurrentMedicationRow from "./type2-current-medication-row";' not in source:
              marker = '} from "./type2-current-medication-ui";\n'
              if source.count(marker) != 1:
                  raise SystemExit("expected current-medication import marker exactly once")
              source = source.replace(marker, marker + 'import Type2CurrentMedicationRow from "./type2-current-medication-row";\n')
          replacement = '''{medications.map((item, index) => <Type2CurrentMedicationRow
                key={item.id}
                item={item}
                index={index}
                locale={locale}
                onChange={(patch) => updateMedication(item.id, patch)}
                onNameChange={(value) => updateMedicationName(item.id, value)}
                onRemove={() => setMedications((current) => current.filter((row) => row.id !== item.id))}
              />)}'''
          pattern = r'\{medications\.map\(\(item, index\) => <div className=\{styles\.currentMed\} key=\{item\.id\}>.*?</div>\)\}'
          source, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
          if count != 1 and "<Type2CurrentMedicationRow" not in source:
              raise SystemExit("expected inline current-medication row block exactly once")
          path.write_text(source)
          PY
          rm -f .github/workflows/implement-type2-current-medication-reconciliation.yml

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test medication intake projection
        run: pnpm --filter @glymize/web exec vitest run test/type2-current-medication-ui.test.ts

      - name: Typecheck web
        run: pnpm --filter @glymize/web typecheck

      - name: Lint web
        run: pnpm --filter @glymize/web lint

      - name: Commit shell wiring and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/type-2/type2-scenarios-client.tsx
          git add -u .github/workflows/implement-type2-current-medication-reconciliation.yml
          git diff --cached --check
          git commit -m "Wire Type 2 medication reconciliation row"
          git push origin HEAD:${GITHUB_REF_NAME}
