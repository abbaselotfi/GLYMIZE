name: One-shot Phase 6 schema version boundary finalizer

on:
  push:
    branches:
      - audit/phase6-schema-version-coverage-20260908

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      CBM_VERSION: 0.10.8
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Apply schema-version boundary enforcement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected snippet not found: {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          browser = "apps/web/lib/catalog/browser-catalog-state.ts"
          replace_once(
              browser,
              "interface PublishedCatalogState extends BrowserCatalogState {\n  schemaVersion: 1 | 2;\n  revision: string;\n  updatedAt: string;\n  updatedBy: string;\n}\n",
              "export interface PublishedCatalogState extends BrowserCatalogState {\n  schemaVersion: 1 | 2;\n  revision: string;\n  updatedAt: string;\n  updatedBy: string;\n}\n",
          )

          old_parser = '''export function parseStoredCatalogState(value: string | null): {
            state: BrowserCatalogState;
            savedAt?: string;
          } | null {
            if (!value) return null;
            try {
              const raw = JSON.parse(value) as {
                state?: Partial<BrowserCatalogState>;
                savedAt?: string;
              } & Partial<BrowserCatalogState>;
              const parsed = raw.state ?? raw;
              return {
                state: {
                  ...emptyState(),
                  ...parsed,
                  marketData: parsed.marketData ?? {},
                  notifications: Array.isArray(parsed.notifications) ? parsed.notifications : [],
                  updateRuns: Array.isArray(parsed.updateRuns) ? parsed.updateRuns : [],
                  masterCandidates: Array.isArray(parsed.masterCandidates) ? parsed.masterCandidates : [],
                  masterRegistry: Array.isArray(parsed.masterRegistry) ? parsed.masterRegistry : [],
                  customPresentations: Array.isArray(parsed.customPresentations)
                    ? parsed.customPresentations
                    : [],
                  marketOverrides: parsed.marketOverrides ?? {},
                },
                savedAt: raw.savedAt,
              };
            } catch {
              return null;
            }
          }
          '''
          new_parser = '''type CatalogSchemaVersion = PublishedCatalogState["schemaVersion"];

          function isRecord(value: unknown): value is Record<string, unknown> {
            return Boolean(value) && typeof value === "object" && !Array.isArray(value);
          }

          export function isSupportedCatalogSchemaVersion(
            value: unknown,
          ): value is CatalogSchemaVersion {
            return value === 1 || value === 2;
          }

          function normalizeCatalogState(
            parsed: Partial<BrowserCatalogState>,
          ): BrowserCatalogState {
            return {
              ...emptyState(),
              ...parsed,
              marketData: parsed.marketData ?? {},
              notifications: Array.isArray(parsed.notifications) ? parsed.notifications : [],
              updateRuns: Array.isArray(parsed.updateRuns) ? parsed.updateRuns : [],
              masterCandidates: Array.isArray(parsed.masterCandidates) ? parsed.masterCandidates : [],
              masterRegistry: Array.isArray(parsed.masterRegistry) ? parsed.masterRegistry : [],
              customPresentations: Array.isArray(parsed.customPresentations)
                ? parsed.customPresentations
                : [],
              marketOverrides: parsed.marketOverrides ?? {},
            };
          }

          export function parseStoredCatalogState(value: string | null): {
            state: BrowserCatalogState;
            savedAt?: string;
          } | null {
            if (!value) return null;
            try {
              const rawValue: unknown = JSON.parse(value);
              if (!isRecord(rawValue)) return null;
              if (
                rawValue.schemaVersion !== undefined &&
                !isSupportedCatalogSchemaVersion(rawValue.schemaVersion)
              ) {
                return null;
              }
              const stateValue = rawValue.state ?? rawValue;
              if (!isRecord(stateValue)) return null;
              return {
                state: normalizeCatalogState(stateValue as Partial<BrowserCatalogState>),
                savedAt: typeof rawValue.savedAt === "string" ? rawValue.savedAt : undefined,
              };
            } catch {
              return null;
            }
          }

          export function parsePublishedCatalogState(
            value: unknown,
          ): PublishedCatalogState | null {
            if (!isRecord(value) || !isSupportedCatalogSchemaVersion(value.schemaVersion)) {
              return null;
            }
            if (
              typeof value.revision !== "string" ||
              !value.revision ||
              typeof value.updatedAt !== "string" ||
              !Number.isFinite(Date.parse(value.updatedAt)) ||
              typeof value.updatedBy !== "string" ||
              !value.updatedBy
            ) {
              return null;
            }
            return {
              ...normalizeCatalogState(value as Partial<BrowserCatalogState>),
              schemaVersion: value.schemaVersion,
              revision: value.revision,
              updatedAt: value.updatedAt,
              updatedBy: value.updatedBy,
            };
          }
          '''
          replace_once(browser, old_parser, new_parser)

          old_published = '''        const published = (await response.json()) as PublishedCatalogState;
                  const publishedState: BrowserCatalogState = {
                    visibility: published.visibility ?? {},
                    insurance: published.insurance ?? {},
                    brands: published.brands ?? {},
                    customGenerics: published.customGenerics ?? [],
                    marketData: published.marketData ?? {},
                    notifications: published.notifications ?? [],
                    updateRuns: published.updateRuns ?? [],
                    masterCandidates: Array.isArray(published.masterCandidates)
                      ? published.masterCandidates
                      : [],
                    masterRegistry: Array.isArray(published.masterRegistry) ? published.masterRegistry : [],
                    customPresentations: Array.isArray(published.customPresentations)
                      ? published.customPresentations
                      : [],
                    marketOverrides: published.marketOverrides ?? {},
                  };
          '''
          new_published = '''        const published = parsePublishedCatalogState(await response.json());
                  if (!published) throw new Error("published_catalog_schema_unsupported");
                  const publishedState = normalizeCatalogState(published);
          '''
          replace_once(browser, old_published, new_published)

          market = "apps/web/lib/clinician-market-v2.ts"
          marker = '''export async function loadClinicianMarketV2() {
          '''
          insertion = '''export type ClinicianMarketDeploymentMeta = {
            schemaVersion: 1;
            runtimeSchemaVersion: 2;
            kind: "glymize_clinician_market_deployment_meta";
            deploymentSha256?: string;
            canonicalSha256?: string;
          };

          function isSha256(value: unknown): value is string {
            return typeof value === "string" && /^[a-f0-9]{64}$/i.test(value);
          }

          export function parseClinicianMarketDeploymentMeta(
            value: unknown,
          ): ClinicianMarketDeploymentMeta | null {
            if (!value || typeof value !== "object" || Array.isArray(value)) return null;
            const meta = value as Record<string, unknown>;
            if (
              meta.schemaVersion !== 1 ||
              meta.runtimeSchemaVersion !== 2 ||
              meta.kind !== "glymize_clinician_market_deployment_meta"
            ) {
              return null;
            }
            if (meta.deploymentSha256 !== undefined && !isSha256(meta.deploymentSha256)) {
              return null;
            }
            if (meta.canonicalSha256 !== undefined && !isSha256(meta.canonicalSha256)) {
              return null;
            }
            if (meta.deploymentSha256 === undefined && meta.canonicalSha256 === undefined) {
              return null;
            }
            return {
              schemaVersion: 1,
              runtimeSchemaVersion: 2,
              kind: "glymize_clinician_market_deployment_meta",
              deploymentSha256: meta.deploymentSha256 as string | undefined,
              canonicalSha256: meta.canonicalSha256 as string | undefined,
            };
          }

          export async function loadClinicianMarketV2() {
          '''
          replace_once(market, marker, insertion)

          old_meta = '''      if (metaResponse.ok) {
                    const meta = await metaResponse.json() as { deploymentSha256?: string; canonicalSha256?: string };
                    runtimeVersion = meta.deploymentSha256 ?? meta.canonicalSha256 ?? runtimeVersion;
                  }
          '''
          new_meta = '''      if (metaResponse.ok) {
                    const meta = parseClinicianMarketDeploymentMeta(await metaResponse.json());
                    runtimeVersion = meta?.deploymentSha256 ?? meta?.canonicalSha256 ?? runtimeVersion;
                  }
          '''
          replace_once(market, old_meta, new_meta)

          test = Path("apps/web/test/schema-version-boundaries.test.ts")
          test.write_text('''import { describe, expect, it } from "vitest";
          import {
            parsePublishedCatalogState,
            parseStoredCatalogState,
          } from "../lib/catalog/browser-catalog-state";
          import { parseClinicianMarketDeploymentMeta } from "../lib/clinician-market-v2";

          const publishedBase = {
            revision: "revision-1",
            updatedAt: "2026-09-08T00:00:00.000Z",
            updatedBy: "schema-test",
            visibility: {},
            insurance: {},
            brands: {},
            customGenerics: [],
          };

          describe("persisted schema version boundaries", () => {
            it("keeps legacy local catalogue drafts readable while rejecting explicit future versions", () => {
              expect(
                parseStoredCatalogState(JSON.stringify({ visibility: {}, insurance: {}, brands: {}, customGenerics: [] })),
              ).not.toBeNull();
              expect(
                parseStoredCatalogState(
                  JSON.stringify({
                    schemaVersion: 2,
                    savedAt: "2026-09-08T00:00:00.000Z",
                    state: { visibility: {}, insurance: {}, brands: {}, customGenerics: [] },
                  }),
                ),
              ).not.toBeNull();
              expect(
                parseStoredCatalogState(
                  JSON.stringify({ schemaVersion: 3, state: { visibility: {}, insurance: {}, brands: {}, customGenerics: [] } }),
                ),
              ).toBeNull();
            });

            it("accepts only supported published catalogue schema versions", () => {
              expect(parsePublishedCatalogState({ ...publishedBase, schemaVersion: 1 })?.schemaVersion).toBe(1);
              expect(parsePublishedCatalogState({ ...publishedBase, schemaVersion: 2 })?.schemaVersion).toBe(2);
              expect(parsePublishedCatalogState({ ...publishedBase, schemaVersion: 3 })).toBeNull();
              expect(parsePublishedCatalogState(publishedBase)).toBeNull();
            });

            it("validates clinician-market deployment metadata before using version hashes", () => {
              const sha = "a".repeat(64);
              const valid = {
                schemaVersion: 1,
                runtimeSchemaVersion: 2,
                kind: "glymize_clinician_market_deployment_meta",
                deploymentSha256: sha,
                canonicalSha256: "b".repeat(64),
              };
              expect(parseClinicianMarketDeploymentMeta(valid)?.deploymentSha256).toBe(sha);
              expect(parseClinicianMarketDeploymentMeta({ ...valid, schemaVersion: 2 })).toBeNull();
              expect(parseClinicianMarketDeploymentMeta({ ...valid, runtimeSchemaVersion: 3 })).toBeNull();
              expect(parseClinicianMarketDeploymentMeta({ ...valid, kind: "other" })).toBeNull();
              expect(parseClinicianMarketDeploymentMeta({ ...valid, deploymentSha256: "not-a-sha" })).toBeNull();
            });
          });
          ''', encoding="utf-8")

          policy = Path("docs/architecture/SCHEMA_VERSIONING.md")
          policy.write_text('''# Schema Versioning Policy

          - Status: Accepted engineering policy
          - Date: 2026-09-08
          - Scope: active persisted, public, and runtime transport boundaries

          ## Decision

          GLYMIZE versions schemas at the boundary that owns compatibility rather than adding a version field to every internal TypeScript interface.

          | Boundary | Version authority | Compatibility rule |
          | --- | --- | --- |
          | Cloudflare D1 storage | Ordered SQL migrations in `apps/admin-worker/migrations` | Schema changes require a new migration; deployed tables are never inferred from TypeScript shapes. |
          | PostgreSQL foundation | Ordered SQL migrations in `infra/postgres` | Foundation schema changes require a new migration before that runtime can be promoted. |
          | HTTP runtime contracts | Major route namespace `/v1` plus contract tests | Breaking transport changes require a reviewed version transition rather than silent response-shape replacement. |
          | Published admin catalogue | `schemaVersion` in `admin-catalog.json` | Readers accept only supported versions. Current writer emits v2; legacy v1 remains readable. Explicit unknown versions are rejected. |
          | Browser catalogue draft | `schemaVersion` in the local-storage envelope | Current writes use v2. Legacy unwrapped drafts remain readable for migration compatibility; an explicit unknown version is rejected. |
          | Clinician market index | Runtime payload `schemaVersion: 2` | Loader rejects any other payload schema before indexing products. |
          | Clinician market chunk manifest/chunks | `schemaVersion: 1` plus `kind` | Loader validates manifest/chunk version, kind, section identity and counts before reconstruction. |
          | Clinician market deployment metadata | `schemaVersion: 1` + `runtimeSchemaVersion: 2` | Metadata is used as a cache/version hint only after version, kind and SHA validation. Invalid metadata cannot bypass validation of the market payload. |
          | Clinical rule/evidence bundles | semantic rule-pack/review/evidence versions | Clinical content lifecycle remains governed by approved rule/review versions; this policy does not create or change clinical authority. |

          ## Non-goals

          Ephemeral in-process DTOs, UI component props and helper-only TypeScript types do not receive independent `schemaVersion` fields merely to satisfy a checklist. They inherit the versioned transport or persistence boundary that owns their compatibility. Authentication tokens and encrypted payloads use their existing versioned cryptographic context/kind boundaries and are not converted into public JSON schemas by this policy.

          ## Reader invariant

          A persisted/public payload with an explicit schema version must never be silently interpreted as a different version. Supported historical versions may have an explicit backward-read path. Unknown future versions fail closed at that boundary. Version validation does not relax field-level, clinical, authorization, integrity, or migration checks.
          ''', encoding="utf-8")

          roadmap = Path("docs/REMAINING_ROADMAP_REBASELINE_2026-09-08.md")
          text = roadmap.read_text(encoding="utf-8")
          old = '| Version all schemas | **Partial** | Rule/evidence/product-safety and several runtime contracts are versioned, but no proof exists that every public/storage schema has a formal version/migration policy. |'
          new = '| Version all schemas | **Partial — active static catalogue boundary enforced** | `docs/architecture/SCHEMA_VERSIONING.md` now defines the compatibility owner for D1/PostgreSQL migrations, `/v1` transports, persisted catalogue/browser snapshots, clinician-market assets and clinical bundles. Active admin-catalogue and clinician-market readers enforce supported schema versions, while legacy local drafts retain an explicit backward-read path. The broad roadmap item remains open until equivalent coverage is proven for every other persisted/public boundary rather than inferred from internal TypeScript types. |'
          if old not in text:
              raise SystemExit("roadmap schema-version row not found")
          roadmap.write_text(text.replace(old, new, 1), encoding="utf-8")

          runtime = Path("docs/architecture/RUNTIME_OF_RECORD.md")
          text = runtime.read_text(encoding="utf-8")
          anchor = 'Some web build-time imports still reuse catalogue and guideline seed files located under `apps/api/src`. That source-code dependency does not make the NestJS process a production runtime or source of truth. Moving those shared seeds to a neutral package remains planned cleanup.\n'
          if anchor in text:
              raise SystemExit("runtime-of-record is stale before schema task; expected Phase 6 seed migration truth-sync")
          insert_anchor = 'Do not point production traffic or real patient data at `apps/api` unless a future reviewed architecture decision, persistence design, authorization model, and deployment plan explicitly promote it.\n'
          addition = 'Persisted/public schema compatibility follows `docs/architecture/SCHEMA_VERSIONING.md`: database schemas are migration-versioned, HTTP transports use the `/v1` major boundary, and active static catalogue assets enforce their declared schema versions at read time. Internal TypeScript DTOs do not become independent persistence schemas merely by existing in code.\n\n'
          if insert_anchor not in text:
              raise SystemExit("runtime-of-record insertion anchor not found")
          runtime.write_text(text.replace(insert_anchor, addition + insert_anchor, 1), encoding="utf-8")
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused schema-version regressions
        run: pnpm --filter @glymize/web test -- schema-version-boundaries.test.ts module-decomposition-equivalence.test.ts

      - name: Typecheck monorepo
        run: pnpm typecheck

      - name: Lint monorepo
        run: pnpm lint

      - name: Test monorepo
        run: pnpm test

      - name: Install pinned Codebase Memory
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh -o /tmp/install-cbm.sh
          chmod +x /tmp/install-cbm.sh
          CBM_DOWNLOAD_URL="https://github.com/DeusData/codebase-memory-mcp/releases/download/v${CBM_VERSION}" /tmp/install-cbm.sh --skip-config --dir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Codebase Memory version
        shell: bash
        run: |
          set -euo pipefail
          codebase-memory-mcp --version | tee /tmp/cbm-version.txt
          grep -Fq "${CBM_VERSION}" /tmp/cbm-version.txt

      - name: Run normative POST graph gate
        shell: pwsh
        run: ./scripts/codebase-memory-gate.ps1 -Phase post -RoadmapReviewed -GraphRelevant

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "abbaselotfi"
          git config user.email "167691975+abbaselotfi@users.noreply.github.com"
          git add \
            apps/web/lib/catalog/browser-catalog-state.ts \
            apps/web/lib/clinician-market-v2.ts \
            apps/web/test/schema-version-boundaries.test.ts \
            docs/architecture/SCHEMA_VERSIONING.md \
            docs/architecture/RUNTIME_OF_RECORD.md \
            docs/REMAINING_ROADMAP_REBASELINE_2026-09-08.md
          git diff --cached --check
          git commit -m "chore: enforce persisted schema version boundaries"
          git push origin HEAD:audit/phase6-schema-version-coverage-20260908
