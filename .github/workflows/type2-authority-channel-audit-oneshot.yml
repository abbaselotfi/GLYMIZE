name: One-shot Type 2 authority channel finalizer

on:
  push:
    branches:
      - 'refactor/type2-authority-channel-separation-20260908'
    paths:
      - '.github/workflows/type2-authority-channel-audit-oneshot.yml'
      - 'scripts/type2-authority-channel-separation-finalize.py'
      - 'scripts/type2-authority-channel-separation-test-fixtures.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CBM_VERSION: '0.10.8'
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic authority-channel patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/type2-authority-channel-separation-finalize.py
          python scripts/type2-authority-channel-separation-test-fixtures.py
          git diff --check
          git status --short

      - name: Typecheck monorepo with dependency builds
        shell: bash
        run: pnpm typecheck

      - name: Run focused authority-channel regression
        shell: bash
        run: pnpm --filter @glymize/clinical-engine exec vitest run test/type2-authority-channel-separation-v2.test.ts test/mash-wegovy-titration-cost-v2.test.ts test/wegovy-continuation-window-cost-v2.test.ts

      - name: Run full clinical engine suite
        shell: bash
        run: pnpm --filter @glymize/clinical-engine test

      - name: Install pinned Codebase Memory
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh -o /tmp/install-cbm.sh
          chmod +x /tmp/install-cbm.sh
          CBM_DOWNLOAD_URL="https://github.com/DeusData/codebase-memory-mcp/releases/download/v${CBM_VERSION}" /tmp/install-cbm.sh --skip-config --dir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Codebase Memory version
        shell: bash
        run: |
          set -euo pipefail
          codebase-memory-mcp --version | tee /tmp/cbm-version.txt
          grep -Fq "${CBM_VERSION}" /tmp/cbm-version.txt

      - name: Run normative POST graph gate
        shell: pwsh
        run: ./scripts/codebase-memory-gate.ps1 -Phase post -RoadmapReviewed -GraphRelevant

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "abbaselotfi"
          git config user.email "167691975+abbaselotfi@users.noreply.github.com"
          git add \
            docs/PROJECT_OVERVIEW_AND_ROADMAP.md \
            docs/REMAINING_ROADMAP_REBASELINE_2026-09-08.md \
            docs/architecture/CLINICAL_RULE_PRECEDENCE.md \
            packages/clinical-engine/src/decision-graph-v2/types.ts \
            packages/clinical-engine/src/decision-graph-v2/index.ts \
            packages/clinical-engine/src/decision-graph-v2/selection-constraints.ts \
            packages/clinical-engine/src/decision-graph-v2/regimens.ts \
            packages/clinical-engine/src/decision-graph-v2/gates.ts \
            packages/clinical-engine/src/decision-graph-v2/enrich.ts \
            packages/clinical-engine/src/decision-graph-v2/engine.ts \
            packages/clinical-engine/src/decision-graph-v2/composer.ts \
            packages/clinical-engine/test/type2-authority-channel-separation-v2.test.ts \
            packages/clinical-engine/test/mash-wegovy-titration-cost-v2.test.ts \
            packages/clinical-engine/test/wegovy-continuation-window-cost-v2.test.ts
          git diff --cached --check
          git commit -m "refactor: separate Type 2 selection authority channels"
          git push origin HEAD:refactor/type2-authority-channel-separation-20260908
