name: One-shot Type 2 rule metadata PRE audit

on:
  push:
    branches:
      - 'chore/type2-rule-metadata-traceability-20260908'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CBM_VERSION: '0.10.8'
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Inventory evidence and rule metadata gaps
        shell: bash
        run: |
          set -euo pipefail
          echo '=== empty evidence arrays ==='
          grep -RIn --include='*.ts' 'evidence: \[\]' packages/clinical-engine/src/decision-graph-v2 || true
          echo '=== evidence source IDs for relevant domains ==='
          grep -RInE --include='*.ts' 'sourceId:.*(KDIGO|ADA10|EASL|ESC|HF|CKD|MASH|MASLD)' packages/clinical-engine/src/decision-graph-v2 || true
          echo '=== rule/review identifiers ==='
          grep -RInE --include='*.ts' '(reviewState:|reviewSetId:|reviewSetVersion:|id: `|id: ")' packages/clinical-engine/src/decision-graph-v2 | head -n 250 || true

      - name: Install pinned Codebase Memory
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh -o /tmp/install-cbm.sh
          chmod +x /tmp/install-cbm.sh
          CBM_DOWNLOAD_URL="https://github.com/DeusData/codebase-memory-mcp/releases/download/v${CBM_VERSION}" /tmp/install-cbm.sh --skip-config --dir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Codebase Memory version
        shell: bash
        run: |
          set -euo pipefail
          codebase-memory-mcp --version | tee /tmp/cbm-version.txt
          grep -Fq "${CBM_VERSION}" /tmp/cbm-version.txt

      - name: Run normative PRE graph gate
        shell: pwsh
        run: ./scripts/codebase-memory-gate.ps1 -Phase pre -RoadmapReviewed -GraphRelevant
