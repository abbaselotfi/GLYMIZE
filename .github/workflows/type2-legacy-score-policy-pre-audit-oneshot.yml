name: One-shot Type 2 legacy score policy PRE audit

on:
  push:
    branches:
      - 'chore/type2-legacy-score-policy-20260908'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CBM_VERSION: '0.10.8'
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Inventory numeric scoring literals
        shell: bash
        run: |
          set -euo pipefail
          echo '=== score mutation literals in clinical-engine src ==='
          grep -RInE --include='*.ts' 'score[[:space:]]*[+\-]?=[[:space:]]*[0-9]+|priorityScore[^\n]*[><=][^\n]*[0-9]+|Math\.(min|max)\([0-9]+,[^\n]*score|coverage\.percent[[:space:]]*/[[:space:]]*[0-9]+' packages/clinical-engine/src || true
          echo '=== priorityScore references ==='
          grep -RIn --include='*.ts' 'priorityScore' packages/clinical-engine/src apps/web/app/type-2 apps/web/lib apps/api/src || true
          echo '=== score helper definitions ==='
          grep -RInE --include='*.ts' 'function .*Score|scoreMedication|marketScore|adjustedClinicalScore' packages/clinical-engine/src || true

      - name: Install pinned Codebase Memory
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh -o /tmp/install-cbm.sh
          chmod +x /tmp/install-cbm.sh
          CBM_DOWNLOAD_URL="https://github.com/DeusData/codebase-memory-mcp/releases/download/v${CBM_VERSION}" \
            /tmp/install-cbm.sh --skip-config --dir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Codebase Memory version
        shell: bash
        run: |
          set -euo pipefail
          codebase-memory-mcp --version | tee /tmp/cbm-version.txt
          grep -Fq "${CBM_VERSION}" /tmp/cbm-version.txt

      - name: Run normative PRE graph gate
        shell: pwsh
        run: ./scripts/codebase-memory-gate.ps1 -Phase pre -RoadmapReviewed -GraphRelevant
