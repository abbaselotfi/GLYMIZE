name: One-shot Type 2 precedence PRE audit

on:
  push:
    branches:
      - 'docs/type2-precedence-legacy-boundary-20260908'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CBM_VERSION: '0.10.8'
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Inventory legacy score consumers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== buildType2MedicationConsiderations ==='
          rg -n --hidden --glob '!.git/**' 'buildType2MedicationConsiderations' . || true
          echo '=== buildLegacyType2Assessment ==='
          rg -n --hidden --glob '!.git/**' 'buildLegacyType2Assessment' . || true
          echo '=== scoreMedication ==='
          rg -n --hidden --glob '!.git/**' 'scoreMedication' packages apps || true
          echo '=== legacy priorityScore ==='
          rg -n --hidden --glob '!.git/**' 'priorityScore' packages/clinical-engine/src apps/web/app/type-2 apps/web/lib || true

      - name: Install pinned Codebase Memory
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh -o /tmp/install-cbm.sh
          chmod +x /tmp/install-cbm.sh
          CBM_DOWNLOAD_URL="https://github.com/DeusData/codebase-memory-mcp/releases/download/v${CBM_VERSION}" \
            /tmp/install-cbm.sh --skip-config --dir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Codebase Memory version
        shell: bash
        run: |
          set -euo pipefail
          codebase-memory-mcp --version | tee /tmp/cbm-version.txt
          grep -Fq "${CBM_VERSION}" /tmp/cbm-version.txt

      - name: Run normative PRE graph gate
        shell: pwsh
        run: ./scripts/codebase-memory-gate.ps1 -Phase pre -RoadmapReviewed -GraphRelevant
